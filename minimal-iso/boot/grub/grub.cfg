set timeout=3
set default=0

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

menuentry 'Tinker OS (Live)' {
  linux /boot/vmlinuz-6.8.0-137-generic boot=casper live-media-path=/casper console=tty0 console=ttyS0,115200n8
  initrd /boot/initrd.img-6.8.0-137-generic
}
